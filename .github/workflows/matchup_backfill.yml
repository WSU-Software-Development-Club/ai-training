name: Matchup Intel — Prod Data Backfill

# Manual-only (workflow_dispatch). Runs the matchup-intel data pipeline against
# the troyster Postgres, in order, so the live site shows real matchup intel:
#   1. apply schema.sql          (idempotent; adds teams.stadium_timezone)
#   2. teams_backfill            (CFBD -> teams dimension: coords + tz)
#   3. weather_backfill          (real results x Open-Meteo -> weather_history grounding)
#   4. game_weather              (observed weather -> real weather factor decks)
#
# DATABASE_URL is a write-only GitHub secret; it's injected here at run time and
# never leaves the runner — the correct home for a repeatable prod migration.
# Mirrors weekly_predictions.yml: a GitHub-hosted runner joins the tailnet to
# reach Postgres (not publicly exposed) via an ephemeral tag:ci auth key.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to weather-deck"
        required: false
        default: "2025"
      min_week:
        description: "Only games from this week onward (0 = whole season)"
        required: false
        default: "0"
      run_weather_history:
        description: "Also run the slow league-wide weather_history grounding backfill"
        type: boolean
        default: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      # `ml` is a namespace package — ensure repo root is importable for `-m`.
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Deliberately NOT installing Prefect: with it absent, flows.py's
      # @task/@flow decorators degrade to plain functions (its try/except
      # ImportError path) — the exact path exercised by the tests and local
      # runs. Installing the full ml/matchup_intel/requirements.txt would pull
      # Prefect and change how game_weather's stage calls execute.
      - name: Install dependencies (no Prefect)
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2.0" "psycopg[binary]>=3.1" requests python-dotenv PyYAML

      - name: Install psql client (for schema apply)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Join the tailnet so the runner can reach Postgres on troyster.
      # Postgres is not publicly exposed; auth via a tagged ephemeral key (tag:ci).
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci

      - name: Apply schema (idempotent)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql

      - name: Backfill teams dimension (CFBD)
        run: python -m ml.matchup_intel.ingest.teams_backfill

      - name: Backfill weather history (grounding)
        if: ${{ inputs.run_weather_history }}
        run: python -m ml.matchup_intel.ingest.weather_backfill

      - name: Generate weather decks for real games
        run: python -m ml.matchup_intel.ingest.game_weather "${{ inputs.season }}" "${{ inputs.min_week }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Matchup backfill failed — check the step logs above."
          echo "Common causes: Tailscale/tag:ci lost tcp:5432 access, expired"
          echo "TS_AUTHKEY, Open-Meteo/CFBD rate limits, or a bad DATABASE_URL secret."
