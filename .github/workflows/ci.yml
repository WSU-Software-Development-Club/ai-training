name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        # Config in ruff.toml. ml/ is excluded for now (legacy scripts).
        run: ruff check backend

  test:
    name: Test (pytest + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aitraining_test
          POSTGRES_USER: aitraining
          POSTGRES_PASSWORD: aitraining
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aitraining -d aitraining_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://aitraining:aitraining@localhost:5432/aitraining_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Load schema into test database
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -f db/schema.sql
      - name: Run pytest
        working-directory: backend
        run: python -m pytest -v
