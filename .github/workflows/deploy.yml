name: Deploy to troyster

on:
  push:
    branches: [main]

# Never run two deploys at once; let an in-flight deploy finish.
concurrency:
  group: deploy-troyster
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull & rebuild on troyster
    runs-on: ubuntu-latest
    env:
      # troyster is reached over the tailnet. DEPLOY_HOST is its MagicDNS name;
      # if MagicDNS is off, replace with its Tailscale IP (100.x.y.z).
      DEPLOY_HOST: troyster
      DEPLOY_USER: troymuehlbauer
    steps:
      # Join the tailnet with a tagged ephemeral auth key (tag:ci).
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Pull latest and rebuild backend
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" bash -se <<'REMOTE'
          set -euo pipefail
          cd /home/troymuehlbauer/ai-training
          git pull --ff-only
          # Rebuild only the backend; the db service (and its pgdata volume) keep running.
          # depends_on ensures db is up. Frontend is hosted on Vercel, not troyster.
          docker compose up -d --build backend
          docker image prune -f
          REMOTE
