<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/swdc-logo.png" />
    <!-- Preload the header logo so it's cached before first paint and doesn't
         re-fetch/blink when the header remounts on client-side navigation. -->
    <link rel="preload" as="image" href="/swdc-logo.png" fetchpriority="high" />
    <!-- Athletic display font for titles/headings (sports-game vibe). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="College Football Analytics & Predictions"
    />
    <title>CFB Analytics</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
