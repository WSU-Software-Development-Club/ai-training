version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=True
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
      - CORS_ORIGINS=https://football.wsu-swdc.dev,http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aitraining}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aitraining}
      # Optional: enables the team page's historical (past-season) records via
      # the College Football Data API. Unset -> only the current season loads.
      - CFBD_API_KEY=${CFBD_API_KEY:-}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: python app.py

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-aitraining}
      - POSTGRES_USER=${POSTGRES_USER:-aitraining}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      # Reachable over Tailscale/LAN only (NOT the public Cloudflare Tunnel).
      # Recommend restricting host port 5432 to the Tailscale interface via firewall.
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aitraining} -d ${POSTGRES_DB:-aitraining}"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:${BACKEND_PORT:-5000}
      - REACT_APP_BACKEND_PORT=${BACKEND_PORT:-5000}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    command: npm start

  # --- Matchup Intelligence Engine (opt-in via `--profile matchup`) ----------
  # Gated behind a compose profile so a plain `docker compose up` (and the
  # deploy.yml `up -d --build backend`) never starts them. Bring up with:
  #   docker compose --profile matchup up -d --build ollama matchup-pipeline
  #   docker compose exec ollama ollama pull gemma3   # one-time model pull
  ollama:
    image: ollama/ollama:latest
    profiles: ["matchup"]
    volumes:
      - ollama_models:/root/.ollama
    # Internal only — must NOT be exposed via the Cloudflare Tunnel.
    restart: unless-stopped

  matchup-pipeline:
    build:
      context: .
      dockerfile: ml/matchup_intel/Dockerfile
    profiles: ["matchup"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aitraining}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aitraining}
      - CFBD_API_KEY=${CFBD_API_KEY:-}
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3}
      - SAMPLE_SIZE_THRESHOLD=${SAMPLE_SIZE_THRESHOLD:-30}
      # Polymarket (Gamma/CLOB) is public, no key needed; egress to
      # gamma-api.polymarket.com / clob.polymarket.com over the open internet
      # (NOT the compose network, NOT the Cloudflare Tunnel). Toggle off if
      # that egress is unavailable/blocked on troyster.
      - POLYMARKET_ENABLED=${POLYMARKET_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    # Batch job (runs the flow once). For scheduled runs, override command to a
    # Prefect worker/deployment.
    restart: "no"

volumes:
  pgdata:
  ollama_models:
