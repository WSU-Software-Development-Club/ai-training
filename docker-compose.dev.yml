version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=True
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
      - CORS_ORIGINS=http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aitraining}:${POSTGRES_PASSWORD:-aitraining}@db:5432/${POSTGRES_DB:-aitraining}
      # Optional: historical team records via the College Football Data API.
      - CFBD_API_KEY=${CFBD_API_KEY:-}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: python app.py

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-aitraining}
      - POSTGRES_USER=${POSTGRES_USER:-aitraining}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aitraining}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aitraining} -d ${POSTGRES_DB:-aitraining}"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:${BACKEND_PORT:-5000}
      - REACT_APP_BACKEND_PORT=${BACKEND_PORT:-5000}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - FAST_REFRESH=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    command: npm start

volumes:
  pgdata:
