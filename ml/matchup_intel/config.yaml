# Non-secret pipeline config. Secrets (DATABASE_URL, CFBD_API_KEY) come from the
# environment / .env, never here. Env vars (UPPERCASE) override these.

# LLM (self-hosted Ollama on troyster; reached over the compose network).
ollama_url: http://ollama:11434
ollama_model: gemma3

# Sample-size guard: historical_rate is only served when sample_size >= this.
sample_size_threshold: 30

# HTTP timeout (seconds) for outbound calls (Ollama, data sources). Generous so
# the first (cold) gemma3 inference, which loads the model into memory, doesn't
# time out.
request_timeout: 180

# Polymarket (Layer-6 reference-panel input). Gamma/CLOB are public read-only
# endpoints -- no API key needed. CFB coverage is sparse by nature (most games
# have no market at all -> null, not an error). Set to false to skip
# Polymarket lookups entirely, e.g. if troyster egress to polymarket.com is
# blocked or rate-limited.
polymarket_enabled: true
